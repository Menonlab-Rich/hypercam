[project]
name = "dirchlet-spectral-unmixing"
version = "0.1.0"
description = "Dirichlet spectral unmixing from event-camera activity frames (Hypercam)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.7",
    "lightning>=2.6",
    "matplotlib>=3.9",
    "mlflow>=3.0",
    "numpy>=2.1",
    "pillow>=11.0",
    "pyarrow>=20.0",
    "scipy>=1.14",
    "tensorboard>=2.19",
    "torch>=2.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
