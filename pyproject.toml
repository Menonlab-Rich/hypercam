[project]
name = "hypercam"
version = "0.1.0"
description = "Wavelength-resolved activity correlation from Prophesee EVT3 event-camera recordings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lakefs>=0.16.0",
    "matplotlib>=3.11.2",
    "openevt>=1.0.4",
    "pint>=0.26.1",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "seabreeze>=2.11.0",
]

[project.scripts]
hypercam = "hypercam:main"
hypercam-chopper = "hypercam.analysis.spectral_correlation_chopper:main"
hypercam-sweep = "hypercam.analysis.duration_sweep:main"
hypercam-sweep-frames = "hypercam.analysis.sweep_frames:main"
hypercam-compare = "hypercam.analysis.comparison_figure:main"
hypercam-source = "hypercam.analysis.source_identification:main"
hypercam-amplitude = "hypercam.analysis.amplitude_encoding:main"
hypercam-data-commit = "hypercam.data_versioning.cli:commit_main"
hypercam-data-checkout = "hypercam.data_versioning.cli:checkout_main"
hypercam-data-status = "hypercam.data_versioning.cli:status_main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
